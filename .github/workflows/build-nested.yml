# Prüft die Weboberfläche und baut das Server-Image des Forks (verschachtelte Alben) für die GitHub Container Registry.
# Läuft bei jedem Push auf feat/nested-albums oder manuell: Actions -> "Build immich-nested server" -> Run workflow
name: Build immich-nested server
on:
  push:
    branches: [feat/nested-albums]
  workflow_dispatch:
    inputs:
      tag:
        description: Image-Tag
        default: v3.3.0-nested-2
permissions:
  contents: read
  packages: write
concurrency:
  group: build-nested
  cancel-in-progress: true
jobs:
  check-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm
      - name: Format, Svelte/TypeScript-Prüfung und Unit-Tests
        run: mise run //web:ci-unit
      - name: Lint
        working-directory: web
        run: pnpm run lint
  build:
    needs: check-web
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || format('v3.3.0-nested-2-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kenny1979/immich-nested-server:${{ env.TAG }}
            ghcr.io/kenny1979/immich-nested-server:latest
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.TAG }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
