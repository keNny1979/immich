# Baut das Server-Image des Forks (verschachtelte Alben) und legt es in die GitHub Container Registry.
# Start: Actions -> "Build immich-nested server" -> Run workflow
name: Build immich-nested server
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image-Tag
        default: v3.3.0-nested-2
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/kenny1979/immich-nested-server:${{ inputs.tag }}
            ghcr.io/kenny1979/immich-nested-server:latest
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ inputs.tag }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
